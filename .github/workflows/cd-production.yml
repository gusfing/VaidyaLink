name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        type: choice
        options:
          - full
          - infrastructure-only
          - lambdas-only
          - frontend-only
        default: full

# Prevent concurrent deployments
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: production
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # Pre-deployment Validation
  # =============================================================================
  pre-deploy-validation:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test

      - name: Run security audit
        run: pnpm audit --audit-level=high

      - name: Build verification
        run: pnpm build

      - name: Check for breaking changes
        run: |
          echo "Checking for breaking changes..."
          # Add breaking change detection logic here

  # =============================================================================
  # Manual Approval Gate
  # =============================================================================
  a
=================================================================
  backup:
    name: Create Deployment Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [approval]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          role-duration-seconds: 1800

      - name: Backup DynamoDB tables
        run: |
          timestamp=$(date +%Y%m%d-%H%M%S)
          tables=("ScanJobs" "Patients" "VoiceJobs")

          for table in "${tables[@]}"; do
            aws dynamodb create-backup \
              --table-name vaidyalink-production-$table \
              --backup-name pre-deploy-backup-$timestamp
          done

      - name: Export current Lambda versions
        run: |
          services=("document-processing" "voice-processing" "clinical-summarizer" "fhir-transformer" "abdm-connector" "hitl-handler")

          for service in "${services[@]}"; do
            version=$(aws lambda publish-version \
              --function-name vaidyalink-production-$service \
              --description "Pre-deployment backup $(date +%Y-%m-%d)" \
              --query 'Version' --output text)
            echo "Backed up $service version: $version"
          done

  # =============================================================================
  # Deploy Infrastructure
  # =============================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backup]
    if: ${{ inputs.deployment_type == 'full' || inputs.deployment_type == 'infrastructure-only' || github.event_name != 'workflow_dispatch' }}

    outputs:
      api_endpoint: ${{ steps.stack-outputs.outputs.api_endpoint }}
      websocket_endpoint: ${{ steps.stack-outputs.outputs.websocket_endpoint }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          role-duration-seconds: 3600

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure
        run: |
          cd infrastructure
          pnpm build

      - name: CDK Diff
        run: |
          cd infrastructure
          npx cdk diff --context environment=production > cdk-diff.txt
          cat cdk-diff.txt

      - name: Upload CDK diff
        uses: actions/upload-artifact@v3
        with:
          name: cdk-diff-production
          path: infrastructure/cdk-diff.txt
          retention-days: 90

      - name: Deploy CDK stacks
        run: |
          cd infrastructure
          npx cdk deploy --all \
            --context environment=production \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Extract stack outputs
        id: stack-outputs
        run: |
          cd infrastructure
          API_ENDPOINT=$(jq -r '.VaidyaLinkApiStack.ApiEndpoint' cdk-outputs.json)
          WS_ENDPOINT=$(jq -r '.VaidyaLinkApiStack.WebSocketEndpoint' cdk-outputs.json)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "websocket_endpoint=$WS_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v3
        with:
          name: cdk-outputs-production
          path: infrastructure/cdk-outputs.json
          retention-days: 90

  # =============================================================================
  # Deploy Lambda Functions
  # =============================================================================
  deploy-lambdas:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backup, deploy-infrastructure]
    if: always() && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') && (inputs.deployment_type == 'full' || inputs.deployment_type == 'lambdas-only' || github.event_name != 'workflow_dispatch')

    strategy:
      max-parallel: 2
      matrix:
        service:
          - document-processing
          - voice-processing
          - clinical-summarizer
          - fhir-transformer
          - abdm-connector
          - hitl-handler

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          role-duration-seconds: 2400

      - name: Setup Python (for Python services)
        if: contains(fromJSON('["document-processing", "clinical-summarizer", "fhir-transformer"]'), matrix.service)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js (for Node services)
        if: contains(fromJSON('["voice-processing", "abdm-connector", "hitl-handler"]'), matrix.service)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package Python Lambda
        if: contains(fromJSON('["document-processing", "clinical-summarizer", "fhir-transformer"]'), matrix.service)
        run: |
          cd backend/${{ matrix.service }}
          pip install -r requirements.txt -t package/
          cp -r *.py package/
          cd package
          zip -r ../function.zip .

      - name: Package Node Lambda
        if: contains(fromJSON('["voice-processing", "abdm-connector", "hitl-handler"]'), matrix.service)
        run: |
          cd backend/${{ matrix.service }}
          npm ci --production
          zip -r function.zip . -x "*.git*" "*.md" "tests/*" "*.test.js"

      - name: Create Lambda alias for canary deployment
        run: |
          # Publish new version
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --zip-file fileb://backend/${{ matrix.service }}/function.zip \
            --publish \
            --query 'Version' --output text)

          echo "Published version: $NEW_VERSION"

          # Update alias to point 90% to old version, 10% to new version (canary)
          aws lambda update-alias \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --name live \
            --function-version $NEW_VERSION \
            --routing-config AdditionalVersionWeights={"$NEW_VERSION"=0.1}

      - name: Wait for canary validation (5 minutes)
        run: |
          echo "⏳ Canary deployment active - monitoring for 5 minutes..."
          sleep 300

      - name: Check canary metrics
        id: canary-check
        run: |
          # Check CloudWatch metrics for errors
          error_count=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=vaidyalink-production-${{ matrix.service }} \
            --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
            --period 300 \
            --statistics Sum \
            --query 'Datapoints[0].Sum' --output text)

          if [ "$error_count" != "None" ] && [ "$error_count" -gt 5 ]; then
            echo "❌ Canary deployment failed - too many errors: $error_count"
            echo "canary_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Canary deployment successful"
          echo "canary_status=success" >> $GITHUB_OUTPUT

      - name: Promote canary to full deployment
        if: steps.canary-check.outputs.canary_status == 'success'
        run: |
          # Get current version
          CURRENT_VERSION=$(aws lambda get-alias \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --name live \
            --query 'FunctionVersion' --output text)

          # Update alias to point 100% to new version
          aws lambda update-alias \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --name live \
            --function-version $CURRENT_VERSION \
            --routing-config '{}'

      - name: Rollback canary on failure
        if: failure() && steps.canary-check.outputs.canary_status == 'failed'
        run: |
          echo "🔄 Rolling back canary deployment..."

          # Get previous version
          PREV_VERSION=$(aws lambda list-versions-by-function \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --query 'Versions[-2].Version' --output text)

          # Rollback alias to previous version
          aws lambda update-alias \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --name live \
            --function-version $PREV_VERSION \
            --routing-config '{}'

      - name: Update Lambda environment variables
        if: steps.canary-check.outputs.canary_status == 'success'
        run: |
          aws lambda update-function-configuration \
            --function-name vaidyalink-production-${{ matrix.service }} \
            --environment Variables="{ENVIRONMENT=production,LOG_LEVEL=info}"

  # =============================================================================
  # Deploy Frontend
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-infrastructure, deploy-lambdas]
    if: always() && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') && (inputs.deployment_type == 'full' || inputs.deployment_type == 'frontend-only' || github.event_name != 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm build
        env:
          NEXT_PUBLIC_API_ENDPOINT: ${{ needs.deploy-infrastructure.outputs.api_endpoint || secrets.PRODUCTION_API_ENDPOINT }}
          NEXT_PUBLIC_WS_ENDPOINT: ${{ needs.deploy-infrastructure.outputs.websocket_endpoint || secrets.PRODUCTION_WS_ENDPOINT }}
          NEXT_PUBLIC_ENVIRONMENT: production
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          cd frontend
          lhci autorun
        continue-on-error: true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          working-directory: ./frontend
          vercel-args: '--prod'
          alias-domains: |
            vaidyalink.com
            www.vaidyalink.com

  # =============================================================================
  # Post-deployment Tests
  # =============================================================================
  post-deploy-tests:
    name: Post-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-infrastructure, deploy-lambdas, deploy-frontend]
    if: always() && needs.deploy-frontend.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test API health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.deploy-infrastructure.outputs.api_endpoint }}/health)
          if [ $response -ne 200 ]; then
            echo "❌ API health check failed with status $response"
            exit 1
          fi
          echo "✅ API health check passed"

      - name: Test critical API endpoints
        run: |
          endpoints=("/api/v1/scans" "/api/v1/patients" "/api/v1/abdm")

          for endpoint in "${endpoints[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.deploy-infrastructure.outputs.api_endpoint }}$endpoint)
            if [ $response -ne 401 ] && [ $response -ne 200 ]; then
              echo "❌ Endpoint $endpoint failed with status $response"
              exit 1
            fi
            echo "✅ Endpoint $endpoint is accessible"
          done

      - name: Test frontend deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://vaidyalink.com)
          if [ $response -ne 200 ]; then
            echo "❌ Frontend health check failed with status $response"
            exit 1
          fi
          echo "✅ Frontend health check passed"

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          # Add smoke test suite here

  # =============================================================================
  # Create Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [post-deploy-tests]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commits
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" > CHANGELOG.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.changelog }}

            ## Deployment Information
            - **Environment**: Production
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            - **Deployed by**: ${{ github.actor }}
          draft: false
          prerelease: false

  # =============================================================================
  # Deployment Notification
  # =============================================================================
  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-lambdas, deploy-frontend, post-deploy-tests]
    if: always()

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.deploy-infrastructure.result }}" == "success" || "${{ needs.deploy-infrastructure.result }}" == "skipped" ]] && \
             [[ "${{ needs.deploy-lambdas.result }}" == "success" || "${{ needs.deploy-lambdas.result }}" == "skipped" ]] && \
             [[ "${{ needs.deploy-frontend.result }}" == "success" || "${{ needs.deploy-frontend.result }}" == "skipped" ]] && \
             [[ "${{ needs.post-deploy-tests.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Production deployment successful" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "${{ steps.status.outputs.message }}",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Production Deployment*\n${{ steps.status.outputs.message }}\n\n*Environment:* production\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Actor:* ${{ github.actor }}\n*Deployment Type:* ${{ inputs.deployment_type || 'full' }}"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Workflow"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Site"
                          },
                          "url": "https://vaidyalink.com"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

      - name: Send email notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🚨 Production Deployment Failed - VaidyaLink'
          to: ${{ secrets.ALERT_EMAIL }}
          from: VaidyaLink CI/CD
          body: |
            Production deployment has failed.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}

            Please check the workflow run for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
