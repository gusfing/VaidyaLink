[pytest]
# Pytest configuration for document processor

# Test discovery patterns
python_files = *.test.py test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    property: Property-based tests using Hypothesis
    unit: Unit tests for specific functions
    integration: Integration tests with AWS services
    slow: Tests that take a long time to run

# Hypothesis settings
hypothesis_profile = default

# Test paths
testpaths = src/__properties__ src/__tests__

# Python path
pythonpath = src
